<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">SiYuan Sisyphus architecture</title>
  <desc id="desc">AI agents and the CLI reach the SiYuan workspace through Sisyphus aggregate tools guarded by notebook permissions and strict safe writes; the extension tool bridges SiYuan&#x27;s official MCP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#8c959f"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#cc1938"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #1f2328; }
      .h { font-size: 17px; font-weight: 700; }
      .b { font-size: 13.5px; fill: #59636e; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #59636e; }
      .chip { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
      .label { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #59636e; }
      .card { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.2; }
      .edge { fill: none; stroke: #8c959f; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .edge-brand { fill: none; stroke: #cc1938; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-brand); }
    </style>
  </defs>

  <!-- Clients -->
  <rect class="card" x="20" y="104" width="252" height="124" rx="14"/>
  <text class="h" x="40" y="140">AI agents</text>
  <text class="b" x="40" y="168">Claude Code · Codex · Cursor</text>
  <text class="b" x="40" y="191">Cherry Studio · Kimi Code · …</text>
  <rect class="card" x="20" y="262" width="252" height="100" rx="14"/>
  <text class="h" x="40" y="298">Terminal &amp; scripts</text>
  <text class="mono" x="40" y="327">siyuan-sisyphus</text>

  <path class="edge-brand" d="M272 166H326"/>
  <text class="label" x="299" y="156" text-anchor="middle">MCP</text>
  <path class="edge-brand" d="M272 312H326"/>
  <text class="label" x="299" y="302" text-anchor="middle">CLI</text>

  <!-- Sisyphus -->
  <rect x="330" y="24" width="520" height="452" rx="18" fill="#fff4f5" stroke="#efb7c1" stroke-width="1.4"/>
  <text class="h" x="354" y="60" fill="#cc1938" style="fill:#cc1938">SiYuan Sisyphus</text>
  <text class="b" x="826" y="60" text-anchor="end">HTTP · stdio · kernel endpoint</text>

  <rect class="card" x="350" y="82" width="480" height="236" rx="12"/>
  <text class="h" x="370" y="114" style="font-size:15.5px">Notebook permissions</text>
  <text class="b" x="370" y="137">checked on every call</text>
  <rect x="676" y="113" width="47" height="22" rx="11" fill="#ffebe9" stroke="#cf222e" stroke-opacity=".35"/><text x="699.4" y="128.5" class="chip" fill="#cf222e" text-anchor="middle">none</text><rect x="728.8" y="113" width="22" height="22" rx="11" fill="#ddf4ff" stroke="#0969da" stroke-opacity=".35"/><text x="739.9" y="128.5" class="chip" fill="#0969da" text-anchor="middle">r</text><rect x="757.0" y="113" width="30" height="22" rx="11" fill="#fff8c5" stroke="#9a6700" stroke-opacity=".35"/><text x="772.2" y="128.5" class="chip" fill="#9a6700" text-anchor="middle">rw</text><rect x="793.4" y="113" width="39" height="22" rx="11" fill="#dafbe1" stroke="#1a7f37" stroke-opacity=".35"/><text x="812.7" y="128.5" class="chip" fill="#1a7f37" text-anchor="middle">rwd</text>
  <path d="M370 156H810" stroke="#d1d9e0" stroke-width="1"/>
  <text class="h" x="370" y="186" style="font-size:15.5px">Strict safe writes</text>
  <text class="b" x="370" y="209">preflight hash → commit → readback</text>
  <path d="M370 228H810" stroke="#d1d9e0" stroke-width="1"/>
  <text class="h" x="370" y="258" style="font-size:15.5px">14 aggregate tools</text>
  <text class="mono" x="370" y="282">fs · document · block · av · search · …</text>

  <rect class="card" x="350" y="338" width="480" height="78" rx="12"/>
  <text class="h" x="370" y="370" style="font-size:15.5px;font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">extension</text>
  <text class="b" x="370" y="394">bridge to SiYuan&#x27;s official MCP</text>

  <text class="b" x="354" y="452">Plus Skills · MCP Apps · document timeline</text>

  <!-- SiYuan -->
  <path class="edge" d="M830 200H866C892 200 892 172 918 172"/>
  <rect x="850" y="152" width="58" height="22" rx="11" fill="#eff2f5"/>
  <text class="label" x="879" y="167.5" text-anchor="middle">/api/*</text>
  <path class="edge" d="M830 377H866C892 377 892 356 918 356"/>
  <rect x="854" y="384" width="50" height="22" rx="11" fill="#eff2f5"/>
  <text class="label" x="879" y="399.5" text-anchor="middle">/mcp</text>

  <rect class="card" x="922" y="108" width="258" height="126" rx="14"/>
  <text class="h" x="942" y="144">SiYuan workspace</text>
  <text class="b" x="942" y="174">notes · databases</text>
  <text class="b" x="942" y="198">assets · snapshots</text>
  <rect class="card" x="922" y="278" width="258" height="198" rx="14"/>
  <text class="h" x="942" y="314">Official MCP</text>
  <rect x="942" y="334" width="218" height="54" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="956" y="366" style="font-size:13.5px">Other plugins&#x27; tools</text>
  <rect x="1114" y="350" width="34" height="22" rx="11" fill="#dafbe1"/>
  <text class="chip" x="1131.0" y="365.5" text-anchor="middle" fill="#1a7f37" style="fill:#1a7f37">on</text>
  <rect x="942" y="400" width="218" height="58" rx="10" fill="#fff5f5" stroke="#cf222e" stroke-dasharray="5 4"/>
  <text x="956" y="424" style="font-size:13.5px">Native SiYuan tools</text>
  <text class="b" x="956" y="445" style="fill:#cf222e">off by default</text>
</svg>
